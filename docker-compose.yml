services:
  backend:
    build: ./medicore-backend
    container_name: medicore_backend
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/medicore_db
      PORT: 5000
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build: ./medicorefrontend
    container_name: medicore_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  mongodb:
    image: mongo:7
    container_name: medicore_mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
