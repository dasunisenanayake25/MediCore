services:
  mongodb:
    image: mongo:7
    container_name: medicore_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build: ./medicore-backend
    container_name: medicore_backend
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/medicore_db}
      JWT_SECRET: ${JWT_SECRET:-medicore_dev_secret_change_me}
      PORT: 5000
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build: ./medicorefrontend
    container_name: medicore_frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data: