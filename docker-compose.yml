services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    image: medicore-backend:${IMAGE_TAG:-latest}
    build: ./medicore-backend
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/medicore_db}
      JWT_SECRET: ${JWT_SECRET:-medicore_dev_secret_change_me}
      PORT: 5000
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    image: medicore-frontend:${IMAGE_TAG:-latest}
    build: ./medicorefrontend
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data: