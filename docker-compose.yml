services:
  backend:
    build: ./medicore-backend
    container_name: medicore_backend
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb+srv://medicore_admin:mediCORE123@cluster0.nu4hyik.mongodb.net/medicore_db?retryWrites=true&w=majority
      PORT: 5000
    restart: unless-stopped

  frontend:
    build: ./medicorefrontend
    container_name: medicore_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
