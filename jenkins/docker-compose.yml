services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: medicore-jenkins:node20
    container_name: medicore-jenkins
    user: "0:984"
    ports:
      - "8082:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /run/user/1001/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - /usr/libexec/docker:/usr/libexec/docker:ro
    restart: unless-stopped

volumes:
  jenkins_home:
